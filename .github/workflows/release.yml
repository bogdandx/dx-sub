name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --onefile --name dx-sub .\main.py

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\dx-sub.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path .\dist\dx-sub.exe.sha256 -Value "$hash *dx-sub.exe"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create ${{ github.ref_name }} `
            .\dist\dx-sub.exe `
            .\dist\dx-sub.exe.sha256 `
            --generate-notes
